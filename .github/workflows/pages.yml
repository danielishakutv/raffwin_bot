# Deploys BOTH environments to the single GitHub Pages site of this repo:
#   production (main branch)    -> https://<owner>.github.io/raffwin_bot/
#   staging    (staging branch) -> https://<owner>.github.io/raffwin_bot/staging/
# A push to either branch rebuilds both from their current heads, so one
# environment can never overwrite the other.
name: Deploy to GitHub Pages

# Manual only: Raffle Win must not be reachable from any public address
# except through its Telegram bots (the live and test hosts). The production
# and staging builds call the real API under /api, which GitHub Pages does not have.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Each branch is built with its own layout: the pnpm workspace
      # (apps/miniapp) once merged, the original single npm package before.
      # The output is copied to <branch>/out so the assemble step needs no branching.
      - name: Build production from main
        working-directory: main
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm --filter @raffwin/miniapp build
            out=apps/miniapp/dist
          else
            npm ci
            npm run build
            out=dist
          fi
          cp "$out/index.html" "$out/404.html"
          mkdir -p out && cp -r "$out/." out/

      - name: Build staging from staging branch
        if: hashFiles('staging/package.json') != ''
        working-directory: staging
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm --filter @raffwin/miniapp build:staging
            out=apps/miniapp/dist
          else
            npm ci
            npm run build:staging
            out=dist
          fi
          cp "$out/index.html" "$out/404.html"
          mkdir -p out && cp -r "$out/." out/

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main/out/. site/
          if [ -d staging/out ]; then mkdir -p site/staging && cp -r staging/out/. site/staging/; fi
          touch site/.nojekyll
          ls -R site | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
