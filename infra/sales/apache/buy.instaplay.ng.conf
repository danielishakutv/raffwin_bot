# /etc/apache2/sites-available/buy.instaplay.ng.conf on aictig (77.237.243.210)
# Sales site, LIVE. Cloudflare-proxied; Cloudflare SSL mode must be Full (strict).
#
# TLS: a Cloudflare Origin certificate for buy and buytest (this box's Let's
# Encrypt account is paused; see gatepod.conf), installed as
#   /etc/ssl/cloudflare/instaplay.ng.pem   /etc/ssl/cloudflare/instaplay.ng.key (600)
#
# The address is the explicit IP, not *: every vhost on this box declares
# 77.237.243.210, and a *:443 vhost would never be consulted (gatepod.conf).
#
# The pages are static files from the release; only /api goes to Node
# (instaplay-api on 127.0.0.1:3420). No CORS anywhere: pages and API share
# this origin, and nothing here names any other site of ours.

<VirtualHost 77.237.243.210:80>
    ServerName buy.instaplay.ng
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    ErrorLog  ${APACHE_LOG_DIR}/buy.instaplay.ng-error.log
    CustomLog ${APACHE_LOG_DIR}/buy.instaplay.ng-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost 77.237.243.210:443>
    ServerName buy.instaplay.ng

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/instaplay.ng.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/instaplay.ng.key

    # Real visitor addresses (rate limits, security log). Ranges from
    # cloudflare.com/ips on 2026-10-10, as in gatepod.conf.
    <IfModule mod_remoteip.c>
        RemoteIPHeader CF-Connecting-IP
        RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22
        RemoteIPTrustedProxy 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
        RemoteIPTrustedProxy 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22
        RemoteIPTrustedProxy 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
        RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
        RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32
        RemoteIPTrustedProxy 2405:b500::/32 2405:8100::/32 2a06:98c0::/29
        RemoteIPTrustedProxy 2c0f:f248::/32
    </IfModule>
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # --- API: the only thing that reaches Node ---------------------------
    ProxyPass        /api/ http://127.0.0.1:3420/api/ retry=0 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:3420/api/
    <Location /api/>
        Header always set Cache-Control "no-store"
    </Location>

    # --- Pages ---------------------------------------------------------------
    DocumentRoot /srv/instaplay/current/web
    <Directory /srv/instaplay/current/web>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        # /paid (Paystack's return page) and any other path load the one page
        FallbackResource /index.html
    </Directory>
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # No third-party script runs here. The Telegram login opens oauth.telegram.org
    # in a popup (or the same tab on phones) and the page asks it for the result
    # (connect-src); the user photo comes from t.me / telegram.org. Telegram's own
    # widget script is NOT used: it calls eval(), which this policy forbids.
    # Paystack is reached by a full-page navigation, which CSP does not govern.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://t.me https://*.telegram.org https://telegram.org https://cdn4.telegram-cdn.org https://cdn5.telegram-cdn.org; font-src 'self'; connect-src 'self' https://oauth.telegram.org; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000"

    LimitRequestBody 65536

    ErrorLog  ${APACHE_LOG_DIR}/buy.instaplay.ng-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/buy.instaplay.ng-ssl-access.log combined
</VirtualHost>
</IfModule>
